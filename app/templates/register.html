{% extends "base.html" %}

{% block content %}
<h2>Регистрация в системе рекомендаций книг</h2>

<div class="instructions">
    <p>📚 <strong>Добро пожаловать!</strong></p>
    <p>Зарегистрируйтесь, чтобы получить персонализированные рекомендации книг</p>
</div>

<form method="post" action="/register">
    <div class="form-group">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username" required placeholder="Введите ваше имя">
    </div>
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Введите ваш email">
    </div>
    <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required placeholder="Введите пароль">
    </div>
    <div style="text-align: center;">
        <button type="submit" class="btn btn-success">📝 Зарегистрироваться</button>
    </div>
</form>

<div style="text-align: center; margin-top: 20px;">
    <p>Уже есть аккаунт? <a href="/login" style="color: #3498db;">Войдите здесь</a></p>
</div>
{% endblock %}
